[features]
hooks = true

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = 'cat "$(git rev-parse --show-toplevel)/hooks/prompts/goals.md"'
additionalContextLimit = 0

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'cat "$(git rev-parse --show-toplevel)/hooks/prompts/goals.md"'
additionalContextLimit = 0

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/hooks/stop.py" codex'
timeout = 120

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/hooks/selfcheck.py"'
timeout = 30
